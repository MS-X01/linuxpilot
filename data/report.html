<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinuxPilot — System Report</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%2334d399'/%3E%3Cpath d='M19 22l13 10-13 10' fill='none' stroke='%2306121a' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M36 44h12' stroke='%2306121a' stroke-width='5.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#0a0f14;--bg2:#0d141b;--card:#111a22;--card2:#16212b;--line:#1f2c38;--tx:#e6edf3;--mut:#8a9bac;--acc:#34d399;--acc2:#60a5fa;--ok:#34d399;--warn:#f5b84b;--bad:#ff6b6b;--r:14px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
:root[data-theme=light]{--bg:#f4f6f9;--bg2:#ffffff;--card:#ffffff;--card2:#f1f5f9;--line:#e2e8f0;--tx:#0f172a;--mut:#64748b;--acc:#059669;--acc2:#2563eb;--ok:#059669;--warn:#b45309;--bad:#dc2626}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;color:var(--tx);background:radial-gradient(900px 420px at 85% -8%,rgba(52,211,153,.09),transparent),var(--bg);min-height:100vh;font-variant-numeric:tabular-nums}
[data-theme=light] body{background:radial-gradient(900px 420px at 85% -8%,rgba(5,150,105,.07),transparent),var(--bg)}
a{color:inherit;text-decoration:none}
.side{position:fixed;inset:0 auto 0 0;width:236px;padding:22px 14px;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:4px;z-index:5}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand svg{width:36px;height:36px;flex:none}.brand small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;color:var(--mut);font-weight:500;font-size:14px}
.nav a:hover{background:var(--card2);color:var(--tx)}.nav a.on{background:rgba(52,211,153,.12);color:var(--tx);box-shadow:inset 2px 0 0 var(--acc)}
[data-theme=light] .nav a.on{background:rgba(5,150,105,.10)}
.side .foot{margin-top:auto;font-size:11px;color:var(--mut);padding:8px}
main{margin-left:236px;padding:0 30px 60px;max-width:1480px}
.top{position:sticky;top:0;z-index:4;display:flex;gap:10px;align-items:center;padding:14px 0;background:linear-gradient(var(--bg) 70%,transparent)}
.top input{flex:1;max-width:420px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;outline:none}
.top input:focus{border-color:var(--acc)}
.btn{padding:8px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer;font:inherit;font-size:14px}.btn:hover{border-color:var(--acc);color:var(--acc)}
section{margin-top:36px}
h2{margin:0 0 14px;font-size:19px;font-weight:650;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}h2:after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;overflow:hidden}
.card h3{margin:0 0 12px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:650}
.hero{display:grid;grid-template-columns:1fr auto auto;gap:26px;align-items:center;padding:26px 28px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(120deg,rgba(52,211,153,.10),rgba(96,165,250,.07) 60%,transparent),var(--card)}
.hero h1{margin:0;font-size:30px;letter-spacing:-.02em}.hero p{margin:6px 0 0;color:var(--mut)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.tag{padding:4px 11px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12px;color:var(--mut)}
.ring{position:relative;width:118px;height:118px;flex:none}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}.ring .bg{stroke:var(--line)}.ring .fg{transition:stroke-dasharray 1s}
.ring .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:26px;font-weight:700}.ring .v small{font-size:11px;color:var(--mut);font-weight:500}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fact{padding:12px 14px;border-radius:11px;background:var(--card);border:1px solid var(--line)}.fact b{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;font-weight:600}.fact span{font-family:var(--mono);font-size:13.5px;word-break:break-word}
.note{margin-bottom:14px;padding:12px 16px;border-radius:12px;border:1px solid rgba(245,184,75,.35);background:rgba(245,184,75,.09);color:var(--tx);font-size:14px}
.attn{margin-top:14px;border-color:rgba(245,184,75,.3)}.attn .row{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}.attn .row:last-child{border:0}.attn small{color:var(--mut);font-family:var(--mono);font-size:12px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--line)}.stack i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mut)}.legend s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;text-decoration:none}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;min-width:60px}.bar i{display:block;height:100%;border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap;font-weight:600}
th:hover{color:var(--acc)}
td{padding:8px 10px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px;vertical-align:middle}tr:hover td{background:var(--card2)}
.scroll{overflow:auto;max-height:520px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font:600 11px system-ui;letter-spacing:.03em}
.c-ok{background:rgba(52,211,153,.14);color:var(--ok)}.c-warn{background:rgba(245,184,75,.15);color:var(--warn)}.c-bad,.c-err{background:rgba(255,107,107,.14);color:var(--bad)}.c-info{background:rgba(96,165,250,.15);color:var(--acc2)}
.check{display:flex;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);align-items:flex-start}.check:last-child{border:0}
.check .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-content:center;font-size:12px;font-weight:700;margin-top:1px}
.check .hint{display:block;color:var(--mut);font-size:12.5px;font-family:var(--mono);margin-top:3px}
.log{font:12.5px/1.6 var(--mono);max-height:380px;overflow:auto;padding:12px;border-radius:10px;background:#070b0f;color:#cbd5e1;border:1px solid var(--line)}.log div{white-space:pre-wrap;word-break:break-all;padding:1px 0}.log .e{color:#ff9b9b}.log .w{color:#f5c46b}
details{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--card)}summary{padding:12px 16px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details pre{margin:0;padding:14px 16px;overflow:auto;border-top:1px solid var(--line);font:12.5px/1.5 var(--mono);max-height:360px;background:#070b0f;color:#cbd5e1;border-radius:0 0 12px 12px}
.nic{display:flex;justify-content:space-between;gap:10px}.nic h4{margin:0;font-family:var(--mono)}.mut{color:var(--mut)}.empty{color:var(--mut);padding:10px;font-style:italic}
.footer{margin-top:50px;text-align:center;color:var(--mut);font-size:12px}
@media(max-width:900px){.side{display:none}main{margin:0;padding:0 14px 40px}.hero{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
@media print{.side,.top{display:none}main{margin:0}body{background:#fff;color:#000}.card,.hero{break-inside:avoid;background:#fff}}
</style>
</head>
<body>
<aside class="side">
  <div class="brand"><svg viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#lg)"/><path d="M19 22l13 10-13 10" fill="none" stroke="#06121a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M36 44h12" stroke="#06121a" stroke-width="5.5" stroke-linecap="round"/></svg><div>LinuxPilot<small id="ver"></small></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="foot">Standalone report — no network needed.<br>Generated <span id="gen"></span></div>
</aside>
<main>
  <div class="top"><input id="q" type="search" placeholder="Filter tables & logs…  (press / to focus)"><button class="btn" id="theme">🌓 Theme</button><button class="btn" onclick="print()">🖨 Print</button><button class="btn" id="dl">⬇ JSON</button></div>
  <div id="app"></div>
  <div class="footer">Made with LinuxPilot · every value above comes from standard Linux tools (/proc, df, ss, ps, systemctl…)</div>
</main>
<script>
const D = __LP_DATA__;
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const M=D.meta, num=v=>parseFloat(v)||0;
const kb=v=>{v=num(v)*1024;const u=["B","KB","MB","GB","TB"];let i=0;while(v>=1024&&i<4){v/=1024;i++}return v.toFixed(v<10&&i?1:0)+" "+u[i]};
const bytes=v=>kb(num(v)/1024);
const dur=s=>{s=num(s);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return (d?d+"d ":"")+(h||d?h+"h ":"")+m+"m"};
const col=p=>p>=85?"var(--bad)":p>=60?"var(--warn)":"var(--ok)";
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.min(100,p)}%;background:${c||col(p)}"></i></div>`;
const ring=(p,label,sub,c)=>{p=Math.max(0,Math.min(100,Math.round(p)));return `<div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" cx="50" cy="50" r="42" pathLength="100" stroke="${c||col(p)}" stroke-dasharray="${p} 100"/></svg><div class="v">${label??p+"%"}<small>${sub||""}</small></div></div>`};
const good=p=>p>=90?"var(--ok)":p>=70?"var(--warn)":"var(--bad)";
const chip=(l,t)=>`<span class="chip c-${l}">${esc(t||l)}</span>`;
const card=(t,b,cls)=>`<div class="card ${cls||""}"><h3>${t}</h3>${b}</div>`;
const fact=(k,v)=>`<div class="fact"><b>${k}</b><span>${esc(v===""||v==null?"—":v)}</span></div>`;

function table(id,cols,rows,max){ // cols:[{h,f,v}]
  if(!rows||!rows.length)return `<div class="empty">Nothing to show.</div>`;
  const th=cols.map((c,i)=>`<th data-i="${i}">${c.h} ↕</th>`).join("");
  const tr=rows.map(r=>"<tr>"+cols.map((c,i)=>`<td data-v="${esc(c.v?c.v(r):r[i])}">${c.f?c.f(r):esc(r[i])}</td>`).join("")+"</tr>").join("");
  return `<div class="scroll" style="${max?`max-height:${max}px`:""}"><table class="tbl" id="${id}"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}
const checks=(rows,withHint)=>rows&&rows.length?rows.map(r=>{const l=r[0],ic={ok:"✓",warn:"!",bad:"✕",err:"✕"}[l]||"•",k=l==="err"?"bad":l;return `<div class="check"><span class="dot c-${k}">${ic}</span><div>${esc(r[1])}${withHint&&r[2]?`<span class="hint">fix: ${esc(r[2])}</span>`:""}</div></div>`}).join(""):`<div class="empty">No data.</div>`;
const score=(rows,w1,w2)=>{let s=100;(rows||[]).forEach(r=>{if(r[0]==="bad"||r[0]==="err")s-=w1;else if(r[0]==="warn")s-=w2});return Math.max(0,s)};

const hs=score(D.health,15,5), ss=score(D.security,15,5);
const memT=num(M.mem_total_kb), memA=num(M.mem_avail_kb), memUsed=memT-memA, memPct=memT?memUsed/memT*100:0;
const swT=num(M.swap_total_kb), swU=swT-num(M.swap_free_kb), swPct=swT?swU/swT*100:0;
const root=(D.disks.find(d=>d[6]==="/")||D.disks[0]||[]), rootPct=num(root[5]);
const cores=num(M.cores)||1;

const attn=()=>{const it=[...(D.security||[]).filter(r=>r[0]!=="ok").map(r=>[r[0],r[1],r[2]?"fix: "+r[2]:""]),...(D.health||[]).filter(r=>r[0]!=="ok").map(r=>[r[0],r[1],""])];
  if(!it.length)return `<div class="card attn" style="border-color:var(--line)"><h3>Needs attention</h3><div class="ok">✓ Nothing needs your attention.</div></div>`;
  return `<div class="card attn"><h3>Needs attention · ${it.length}</h3>${it.slice(0,8).map(r=>`<div class="row">${chip(r[0]==="err"?"bad":r[0],r[0]==="warn"?"warning":"problem")}<div>${esc(r[1])}<br><small>${esc(r[2])}</small></div></div>`).join("")}${it.length>8?`<div class="mut" style="margin-top:8px;font-size:12px">+ ${it.length-8} more in Health / Security below</div>`:""}</div>`};
const sections=[
["overview","🏠","Overview",()=>`
${M.is_root===false?`<div class="note">⚠ This report was generated <b>without root</b>, so a few details are limited (process names on ports, some security checks). For the full picture run <code>sudo linuxpilot --report html</code>.</div>`:""}
<div class="hero"><div><h1>${esc(M.host)}</h1><p>${esc(M.os)} · kernel ${esc(M.kernel)} · ${esc(M.arch)}</p>
<div class="tags"><span class="tag">⏱ up ${dur(M.uptime_s)}</span><span class="tag">👤 ${esc(M.user)}</span><span class="tag">🧠 ${cores} ${cores===1?"core":"cores"}</span><span class="tag">🖥 ${esc(M.virt&&M.virt!=="none"?M.virt:"bare metal / unknown")}</span><span class="tag">🐚 ${esc(M.shell)}</span></div></div>
${ring(hs,hs,"health",good(hs))}${ring(ss,ss,"security",good(ss))}</div>
${attn()}
<div class="grid g4" style="margin-top:16px">
${card("CPU",`<div style="display:flex;justify-content:center">${ring(num(M.cpu_pct),null,"usage")}</div><div class="mut" style="text-align:center;margin-top:8px;font-size:12px">${esc(M.cpu_model)}</div>`)}
${card("Memory",`<div style="display:flex;justify-content:center">${ring(memPct,null,"used")}</div><div class="mut" style="text-align:center;margin-top:8px;font-size:12px">${kb(memUsed)} of ${kb(memT)}</div>`)}
${card("Swap",`<div style="display:flex;justify-content:center">${ring(swPct,swT?null:"—","used")}</div><div class="mut" style="text-align:center;margin-top:8px;font-size:12px">${swT?kb(swU)+" of "+kb(swT):"no swap configured"}</div>`)}
${card("Disk /",`<div style="display:flex;justify-content:center">${ring(rootPct,null,"used")}</div><div class="mut" style="text-align:center;margin-top:8px;font-size:12px">${root[3]?kb(root[3])+" used of "+kb(root[2]):""}</div>`)}
</div>
<div class="grid g2" style="margin-top:16px">
${card("Memory breakdown",(()=>{const f=num(M.mem_free_kb),c=num(M.mem_cached_kb)+num(M.mem_buffers_kb),u=Math.max(0,memT-f-c);const p=x=>memT?x/memT*100:0;return `<div class="stack"><i style="width:${p(u)}%;background:var(--acc)"></i><i style="width:${p(c)}%;background:var(--acc2)"></i><i style="width:${p(f)}%;background:transparent"></i></div><div class="legend"><span><s style="background:var(--acc)"></s>Used ${kb(u)}</span><span><s style="background:var(--acc2)"></s>Cache ${kb(c)}</span><span><s style="background:var(--line)"></s>Free ${kb(f)}</span></div>`})())}
${card("Load average",["1 min","5 min","15 min"].map((l,i)=>{const v=num(M.load[i]),p=v/cores*100;return `<div style="display:grid;grid-template-columns:60px 1fr 50px;gap:10px;align-items:center;margin:8px 0"><span class="mut">${l}</span>${bar(p)}<b style="font-family:var(--mono)">${v.toFixed(2)}</b></div>`}).join("")+`<div class="mut" style="font-size:12px">Load above ${cores} (core count) means the CPU is saturated.</div>`)}
</div>
<div class="facts" style="margin-top:16px">${fact("Boot time",M.boot)}${fact("Processes",M.procs)}${fact("Logged-in users",M.users_n)}${fact("Running services",M.svc_running)}${fact("Packages installed",M.pkgs)}${fact("Updates pending",M.updates===""?"unknown":M.updates)}${fact("Temperature",M.temp_c?M.temp_c+" °C":"n/a")}${fact("Timezone",M.tz)}</div>`],
["health","🩺","Health",()=>`<div class="grid g2">${card("Checks",checks(D.health))}${card("Summary",`<div style="display:flex;gap:24px;align-items:center">${ring(hs,hs,"score",good(hs))}<div>${chip("ok",D.health.filter(r=>r[0]==="ok").length+" passed")}<br><br>${chip("warn",D.health.filter(r=>r[0]==="warn").length+" warnings")}<br><br>${chip("bad",D.health.filter(r=>r[0]==="err").length+" problems")}</div></div>`)}</div>`],
["security","🛡️","Security",()=>`<div class="grid g2">${card("Audit findings",checks(D.security,true))}${card("Score",`<div style="display:flex;gap:24px;align-items:center">${ring(ss,ss,"score",good(ss))}<div class="mut">Read-only audit of firewall, SSH, accounts, file permissions, kernel hardening and updates. Each warning includes how to fix it.</div></div>`)}</div>`],
["storage","💽","Storage",()=>card("Filesystems",table("t-disk",[{h:"Mount",f:r=>`<b>${esc(r[6])}</b>`,v:r=>r[6]},{h:"Device",f:r=>esc(r[0])},{h:"Type",f:r=>esc(r[1])},{h:"Size",f:r=>kb(r[2]),v:r=>r[2]},{h:"Used",f:r=>kb(r[3]),v:r=>r[3]},{h:"Free",f:r=>kb(r[4]),v:r=>r[4]},{h:"Usage",f:r=>`<div style="display:flex;gap:8px;align-items:center">${bar(num(r[5]))}<span>${r[5]}%</span></div>`,v:r=>r[5]}],D.disks))+`<div style="height:16px"></div>`+card("Block devices",table("t-blk",[{h:"Name"},{h:"Size"},{h:"Type"},{h:"FS"},{h:"Mountpoint"}],D.blk))],
["network","🌐","Network",()=>`<div class="grid g3">${D.nics.map(n=>card(`<span class="nic"><span>Interface</span>${chip(n[1]==="up"?"ok":"warn",n[1]||"?")}</span>`,`<h4>${esc(n[0])}</h4><div class="mut" style="margin:6px 0;font-family:var(--mono);font-size:12.5px">${esc(n[3]||"no IPv4")}<br>${esc(n[4]||"")}</div><div class="mut" style="font-size:12px">MAC ${esc(n[2]||"—")}</div><div style="display:flex;gap:18px;margin-top:10px"><span>↓ <b>${bytes(n[5])}</b></span><span>↑ <b>${bytes(n[6])}</b></span></div>`)).join("")}</div><div style="height:16px"></div>`+
 card(`Listening ports <span class="mut">(${D.ports.length})</span>`,table("t-ports",[{h:"Proto"},{h:"Address"},{h:"Port",v:r=>r[2]},{h:"Exposure",f:r=>{const a=r[1];return /^(127\.|::1)/.test(a)?chip("ok","local only"):/^(0\.0\.0\.0|\*|::|\[::\])$/.test(a)?chip("warn","all interfaces"):chip("info","bound")},v:r=>r[1]},{h:"Process",f:r=>esc(r[3]||"—")}],D.ports))],
["processes","⚙️","Processes",()=>`<div class="grid g2">${card("Top by CPU",table("t-cpu",[{h:"PID"},{h:"User"},{h:"CPU %",f:r=>`<div style="display:flex;gap:8px;align-items:center">${bar(num(r[2]))}${r[2]}</div>`,v:r=>r[2]},{h:"Mem %",v:r=>r[3]},{h:"Command",f:r=>esc(r[6])}],D.pcpu))}${card("Top by memory",table("t-mem",[{h:"PID"},{h:"User"},{h:"Mem %",f:r=>`<div style="display:flex;gap:8px;align-items:center">${bar(num(r[3])*2,"var(--acc2)")}${r[3]}</div>`,v:r=>r[3]},{h:"RSS",f:r=>kb(r[4]),v:r=>r[4]},{h:"Command",f:r=>esc(r[6])}],D.pmem))}</div>`],
["services","🛠️","Services & Logs",()=>`<div class="grid g2">${card("Failed services",D.failed.length?table("t-fail",[{h:"Unit"},{h:"State"},{h:"Description"}],D.failed):`<div class="empty ok">✓ No failed units.</div>`)}${card("Docker containers",D.docker.length?table("t-dock",[{h:"Name"},{h:"Image"},{h:"Status"},{h:"Ports"}],D.docker):`<div class="empty">Docker not installed or no containers.</div>`)}</div><div style="height:16px"></div>`+card("Recent errors",`<div class="log">${D.errors.length?D.errors.map(r=>{const t=r.join(" ");return `<div class="logline ${/crit|fatal|panic|fail|error|denied/i.test(t)?"e":/warn/i.test(t)?"w":""}">${esc(t)}</div>`}).join(""):'<div class="ok">✓ Nothing logged at error level.</div>'}</div>`)],
["users","👥","Users",()=>`<div class="grid g2">${card("Logged in now",table("t-who",[{h:"User"},{h:"TTY"},{h:"Since"},{h:"From"}],D.who))}${card("Human accounts",table("t-usr",[{h:"User"},{h:"UID"},{h:"Home"},{h:"Shell"}],D.accounts))}</div><div style="height:16px"></div>`+card("Recent logins",`<div class="log">${D.last.map(r=>`<div class="logline">${esc(r.join(" "))}</div>`).join("")||"—"}</div>`)],
["hardware","🔌","Hardware",()=>`<div class="grid g2">${card("PCI devices",table("t-pci",[{h:"Device"}],D.pci,360))}${card("USB devices",table("t-usb",[{h:"Device"}],D.usb,360))}</div>`],
["raw","🧾","Raw output",()=>Object.entries(D.raw).map(([k,v])=>`<details><summary>$ ${esc(k)} <button class="btn" onclick="event.preventDefault();navigator.clipboard.writeText(D.raw[this.dataset.k])" data-k="${esc(k)}">Copy</button></summary><pre>${esc(v)}</pre></details>`).join("")]
];

$("#app").innerHTML=sections.map(([id,ic,t,f])=>`<section id="${id}"><h2>${ic} ${t}</h2>${f()}</section>`).join("");
$("#nav").innerHTML=sections.map(([id,ic,t])=>`<a href="#${id}" data-s="${id}">${ic} ${t}</a>`).join("");
$("#ver").textContent="v"+M.lp_version; $("#gen").textContent=M.generated; document.title=`${M.host} — LinuxPilot report`;

// sortable tables
document.querySelectorAll("table.tbl").forEach(t=>t.querySelectorAll("th").forEach(th=>th.onclick=()=>{
  const i=+th.dataset.i,b=t.tBodies[0],dir=th.dataset.d=th.dataset.d==="1"?"-1":"1";
  [...b.rows].sort((x,y)=>{const a=x.cells[i].dataset.v,c=y.cells[i].dataset.v,n=parseFloat(a)-parseFloat(c);return (isNaN(n)?a.localeCompare(c):n)*dir}).forEach(r=>b.appendChild(r))}));
// filter
$("#q").oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll(".tbl tbody tr,.logline").forEach(r=>r.style.display=!q||r.textContent.toLowerCase().includes(q)?"":"none")};
addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("#q").focus()}});
// scrollspy
const links=[...document.querySelectorAll("#nav a")];
document.querySelectorAll("section").forEach(sec=>new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(l=>l.classList.toggle("on",l.dataset.s===sec.id))}),{rootMargin:"-30% 0px -60% 0px"}).observe(sec));
// theme + download
const th=localStorage.getItem("lp-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");document.documentElement.dataset.theme=th;
$("#theme").onclick=()=>{const n=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("lp-theme",n)}catch(e){}};
$("#dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:"application/json"}));a.download=`linuxpilot-${M.host}.json`;a.click()};
</script>
</body>
</html>
